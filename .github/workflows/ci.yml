name: Frontend CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, prod]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
        env:
          VITE_ROOT_API: https://placeholder.example.com
